; WLED-LightMusic build profiles (fork-specific, committed).
; Loaded via `extra_configs` in platformio.ini. Do not put these into platformio_override.ini.
;
; Roles:
;   lightmusic_master_esp32   - ESP32 master: audioreactive (INMP441), SoftAP for 8 nodes, 1 s state heartbeat
;   lightmusic_node_esp8266   - lean ESP8266 LED node (1D strips), UDP sync receive only
;   lightmusic_node_esp32*    - ESP32-family LED nodes (2D matrices, GIF, particle system), no audio analysis
;
; NOTE: with `extends`, `build_flags` are replaced (not merged), and pio-scripts/output_bins.py
; picks the FIRST WLED_RELEASE_NAME it finds - so every env below lists its flags in full.
; `custom_usermods` IS inherited, therefore node envs reset it explicitly to an empty value.

[lightmusic]
disable_flags =
  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_INFRARED
  -D WLED_DISABLE_MQTT
  -D WLED_DISABLE_ADALIGHT
  -D WLED_DISABLE_LOXONE
  -D WLED_DISABLE_ESPNOW
master_flags =
  -D LIGHTMUSIC_FORK
  -D LIGHTMUSIC_ROLE_MASTER
  -D LIGHTMUSIC_AP_MAX_CONNECTIONS=8
  -D LIGHTMUSIC_SYNC_HEARTBEAT_INTERVAL=1000
node_flags =
  -D LIGHTMUSIC_FORK
  -D LIGHTMUSIC_ROLE_NODE
  -D LIGHTMUSIC_AP_MAX_CONNECTIONS=8
  -D LIGHTMUSIC_SYNC_HEARTBEAT_INTERVAL=0

[env:lightmusic_master_esp32]
extends = env:esp32dev
custom_usermods = audioreactive
test_ignore = lightmusic
build_flags = ${common.build_flags} ${esp32_idf_V4.build_flags} -D WLED_RELEASE_NAME=\"Lightmusic_Master_ESP32\"
  -DARDUINO_USB_CDC_ON_BOOT=0
  ${lightmusic.disable_flags}
  ${lightmusic.master_flags}

[env:lightmusic_node_esp8266]
extends = env:nodemcuv2
custom_usermods =
test_ignore = lightmusic
build_flags = ${common.build_flags} ${esp8266.build_flags} -D WLED_RELEASE_NAME=\"Lightmusic_Node_ESP8266\"
  -D WLED_DISABLE_PARTICLESYSTEM2D
  ${lightmusic.disable_flags}
  ${lightmusic.node_flags}

[env:lightmusic_node_esp32]
extends = env:esp32dev
custom_usermods =
test_ignore = lightmusic
build_flags = ${common.build_flags} ${esp32_idf_V4.build_flags} -D WLED_RELEASE_NAME=\"Lightmusic_Node_ESP32\"
  -DARDUINO_USB_CDC_ON_BOOT=0
  ${lightmusic.disable_flags}
  ${lightmusic.node_flags}

[env:lightmusic_node_esp32c3]
extends = env:esp32c3dev
custom_usermods =
test_ignore = lightmusic
build_flags = ${common.build_flags} ${esp32c3.build_flags} -D WLED_RELEASE_NAME=\"Lightmusic_Node_ESP32-C3\"
  -D WLED_WATCHDOG_TIMEOUT=0
  -DLOLIN_WIFI_FIX
  -DARDUINO_USB_CDC_ON_BOOT=1
  ${lightmusic.disable_flags}
  ${lightmusic.node_flags}

[env:lightmusic_node_esp32s3]
extends = env:esp32s3_4M_qspi
custom_usermods =
test_ignore = lightmusic
build_flags = ${common.build_flags} ${esp32s3.build_flags} -D WLED_RELEASE_NAME=\"Lightmusic_Node_ESP32-S3_4M\"
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DLOLIN_WIFI_FIX
  -D WLED_WATCHDOG_TIMEOUT=0
  ${lightmusic.disable_flags}
  ${lightmusic.node_flags}

[env:lightmusic_node_esp32s2]
extends = env:lolin_s2_mini
custom_usermods =
test_ignore = lightmusic
build_flags = ${common.build_flags} ${esp32s2.build_flags} -D WLED_RELEASE_NAME=\"Lightmusic_Node_ESP32-S2\"
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MSC_ON_BOOT=0
  -DARDUINO_USB_DFU_ON_BOOT=0
  -DBOARD_HAS_PSRAM
  -DLOLIN_WIFI_FIX
  -D WLED_WATCHDOG_TIMEOUT=0
  -D DATA_PINS=16
  -D HW_PIN_SCL=35
  -D HW_PIN_SDA=33
  -D HW_PIN_CLOCKSPI=7
  -D HW_PIN_DATASPI=11
  -D HW_PIN_MISOSPI=9
  ${lightmusic.disable_flags}
  ${lightmusic.node_flags}
